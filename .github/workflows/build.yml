name: Build Docker Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "Dockerfile"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Version
        id: v
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile | head -n1)
          [ -n "$VERSION" ] || { echo "ARG CADDY_VERSION not found in Dockerfile" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/caddy" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha, mode=max
